name: Rust

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  BIN: simple_http_upload

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # Release binaries for every platform. Runs on each push / PR (binaries are
  # kept as workflow artifacts) and is published as a GitHub Release on v* tags.
  release-build:
    needs: build
    name: release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  asset: simple_http_upload-linux-x86_64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  asset: simple_http_upload-linux-aarch64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,       asset: simple_http_upload-macos-aarch64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,        asset: simple_http_upload-macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     asset: simple_http_upload-windows-x86_64.exe }

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust target
      run: rustup target add ${{ matrix.target }}

    - name: Install cross toolchain (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

    - name: Build release
      shell: bash
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Rename binary
      shell: bash
      run: |
        exe="$BIN"
        if [ "$RUNNER_OS" = "Windows" ]; then exe="$BIN.exe"; fi
        cp "target/${{ matrix.target }}/release/$exe" "${{ matrix.asset }}"

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset }}
        path: ${{ matrix.asset }}
        if-no-files-found: error

  publish:
    name: publish release
    needs: release-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Checksums
      working-directory: dist
      run: sha256sum * > SHA256SUMS

    - uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
